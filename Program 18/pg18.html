<!DOCTYPE html>
<html>
<body>
<style>
    html, body {
        margin: 0;
        width: 100%;
        height: 100%;
    }
</style>
<button onclick="changeColor()">Change Color</button>
<br><br>

<button onclick="changeBackgroundImage()">Change Background Image</button>
<br><br>

<button onclick="resetBackground()">Reset to Normal</button>

<script>

const originalColor = "white";

function changeColor() {
    document.body.style.backgroundImage = "";
    document.body.style.backgroundColor = "lightblue";
}

function changeBackgroundImage() {
    document.body.style.backgroundImage =
        "url('https://5.imimg.com/data5/SELLER/Default/2024/2/394165070/TP/VQ/AB/2315411/ocean-enchanted-wallpaper.jpg')";

    document.body.style.backgroundColor = "";
    document.body.style.backgroundPosition = "center";
    document.body.style.backgroundRepeat = "no-repeat";
    document.body.style.backgroundSize = "cover";
}

function resetBackground() {
    document.body.style.backgroundColor = originalColor;
    document.body.style.backgroundImage = "";
}

</script>

</body>
</html>
